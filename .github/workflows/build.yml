name: Build Kwrt · AX1800 Pro

# 三种触发方式：
#   1) workflow_dispatch —— 手动点「Run workflow」，无条件编译（拿当天最新上游）
#   2) push              —— 提交信息里带 [build] 就无条件编译；
#                           不带则按上游是否变化决定（同下面定时逻辑）
#   3) schedule          —— 每周一定时跑，先探测 5 个上游源的 HEAD，
#                          跟 .build-state 里上次构建记录比对，没变就跳过，变了才编
#
# 上游源码全部是 --depth 1 现拉、不 pin 版本，所以「手动触发即最新」。
# 定时任务是无人值守的加速版本，省的是「上游没动却白编 90 分钟」。
#
# 注意：GitHub 会在仓库连续 60 天无活动后自动禁用 schedule，需要手动点一次唤醒。

on:
  workflow_dispatch:
    inputs:
      target:
        description: '设备目录（devices/ 下的名字）'
        type: string
        default: 'qualcommax_ipq60xx'
      skip_check:
        description: '跳过编译前的关键包校验（不建议）'
        type: boolean
        default: false
  push:
    # 给不会用网页点「Run workflow」的场合留一条路：
    # commit message 里带 [build] 就无条件编译，不带则只在上游有变化时编。
    # 好处是「git push 即可构建」，不需要 PAT、不需要网页操作。
    branches: [ main ]
    paths-ignore:
      # 构建结束后 bot 自己提交的进度记录，不该再触发一轮
      - '.build-state'
  schedule:
    # 每天 03:00（北京时间）= 前一天 19:00 UTC
    # 只跑得很轻：probe 先比对 .build-state，上游没变就直接跳过（约 1 分钟），
    # 变了才进 5 小时的编译。这样「上游一更新，最多隔一天就有新固件」。
    - cron: '0 19 * * *'

# 同一时刻只允许一个构建。手动触发撞上定时任务时排队，而不是两个 5 小时的 job
# 并行跑完再一起去推 .build-state（推失败的后果是下轮重复编译一次）。
concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  probe:
    runs-on: ubuntu-22.04
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      openwrt: ${{ steps.check.outputs.openwrt }}
      immortalwrt: ${{ steps.check.outputs.immortalwrt }}
      libwrt_tree: ${{ steps.check.outputs.libwrt_tree }}
      libwrt_cfg: ${{ steps.check.outputs.libwrt_cfg }}
      oppackages: ${{ steps.check.outputs.oppackages }}
      # 本次上游到底改了什么（markdown 片段），直接写进 Release 说明
      changes: ${{ steps.check.outputs.changes }}
      prev_build: ${{ steps.check.outputs.prev_build }}
    steps:
      - name: 检出工程
        uses: actions/checkout@v4

      - name: 探测上游是否有更新
        id: check
        env:
          # 用 env 传进来，不要直接插值到 shell（commit message 可能含引号/反引号）
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          # compare API 要读上游仓库的提交列表，带 token 可避开匿名 60 次/小时的限流
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # 只判定 5 个真正决定固件内容的源：
          #   openwrt/openwrt      openwrt-25.12  主树
          #   immortalwrt          openwrt-25.12  openssl / ppp + 5 个内核与 nftables 补丁
          #   LiBwrt/openwrt-6.x   25.12-nss      NSS 目标树、ath11k、mac80211（最关键）
          #   LiBwrt/LibWrt        25.12-nss      image-commands.mk / Config-ipq.in / Config.in
          #   kiddin9/op-packages  main           argon / openclash / fullconenat-nft 等插件
          # coolsnowwolf/lede（hack-6.12）、qosmio/sqm-scripts-nss、laipeng668/nss-packages
          # 影响窄，且 lede master 每天多次提交，纳入会让「有变化」永远成立，故不参与判定。
          sha() {
            git ls-remote "https://github.com/$1" "refs/heads/$2" 2>/dev/null | awk '{print $1}' | head -1
          }
          OW=$(sha openwrt/openwrt openwrt-25.12)
          IW=$(sha immortalwrt/immortalwrt openwrt-25.12)
          LT=$(sha LiBwrt/openwrt-6.x 25.12-nss)
          LC=$(sha LiBwrt/LibWrt 25.12-nss)
          OP=$(sha kiddin9/op-packages main)

          for pair in "openwrt:$OW" "immortalwrt:$IW" "libwrt_tree:$LT" "libwrt_cfg:$LC" "oppackages:$OP"; do
            if [ -z "${pair#*:}" ]; then
              echo "::error::探测 ${pair%%:*} 失败，拿不到 HEAD sha"
              exit 1
            fi
          done

          STATE=.build-state
          prev() {
            if [ -f "$STATE" ]; then
              grep -m1 "^$1=" "$STATE" 2>/dev/null | cut -d= -f2- || true
            fi
          }

          changed=0
          echo "上游 HEAD 与上次构建记录比对："
          for pair in "openwrt:$OW" "immortalwrt:$IW" "libwrt_tree:$LT" "libwrt_cfg:$LC" "oppackages:$OP"; do
            k="${pair%%:*}"; v="${pair#*:}"
            p=$(prev "$k")
            if [ "$p" = "$v" ]; then
              printf '  %-14s %s  (无变化)\n' "$k" "$(echo "$v" | cut -c1-10)"
            else
              printf '  %-14s %s -> %s  (有变化)\n' "$k" \
                "$(echo "${p:-<无记录>}" | cut -c1-10)" "$(echo "$v" | cut -c1-10)"
              changed=1
            fi
          done

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "触发方式：手动 → 无条件编译"
            changed=1
          elif [ "$EVENT_NAME" = "push" ]; then
            if printf '%s' "$COMMIT_MSG" | grep -q '\[build\]'; then
              echo "触发方式：push + [build] 标记 → 无条件编译"
              changed=1
            else
              echo "触发方式：push（提交信息无 [build]）→ 仅上游有变化时编译"
            fi
          else
            echo "触发方式：定时"
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

          {
            echo "openwrt=$OW"
            echo "immortalwrt=$IW"
            echo "libwrt_tree=$LT"
            echo "libwrt_cfg=$LC"
            echo "oppackages=$OP"
          } >> "$GITHUB_OUTPUT"

          # ---------- 生成本次上游更新清单 ----------
          # 目的：Release 页面能直接看到「这一版比上一版，上游到底动了什么」，
          #       不用点进 5 个上游仓库逐个翻提交。
          # 手段：GitHub compare API（old...new），不依赖本地 git 历史
          #       ——  编译是 --depth 1 现拉的，本地根本没有旧提交。
          PREV_BUILD=$( (grep -m1 '^build=' "$STATE" 2>/dev/null || true) | cut -d= -f2- )
          echo "prev_build=${PREV_BUILD}" >> "$GITHUB_OUTPUT"

          CH="$RUNNER_TEMP/changes.md"
          : > "$CH"

          repo_note() {
            slug=$1; label=$2; new=$3; old=$4
            if [ -z "$old" ]; then
              printf -- '- **%s** `%s`（首次记录，无对比基准）\n' \
                "$label" "$(echo "$new" | cut -c1-7)" >> "$CH"
              return 0
            fi
            [ "$old" = "$new" ] && return 0
            printf -- '- **%s** `%s` → `%s`\n' \
              "$label" "$(echo "$old" | cut -c1-7)" "$(echo "$new" | cut -c1-7)" >> "$CH"
            raw=$(gh api "repos/$slug/compare/$old...$new" 2>/dev/null || true)
            if [ -z "$raw" ]; then
              printf '  - _取不到提交列表（API 异常或历史已分叉）_\n' >> "$CH"
              return 0
            fi
            total=$(printf '%s' "$raw" | jq -r '.total_commits // 0')
            case "$total" in ''|*[!0-9]*) total=0 ;; esac
            printf '  - 共 %s 条提交：\n' "$total" >> "$CH"
            printf '%s' "$raw" | jq -r \
              '.commits[-10:][] | "    - [`\(.sha[0:7])`](\(.html_url)) \(.commit.message | split("\n")[0] | .[0:100])"' \
              >> "$CH"
            if [ "$total" -gt 10 ]; then
              printf '    - ……另 %s 条见上方链接\n' "$((total - 10))" >> "$CH"
            fi
          }

          repo_note openwrt/openwrt         "openwrt 主树"     "$OW" "$(prev openwrt)"
          repo_note immortalwrt/immortalwrt "immortalwrt"      "$IW" "$(prev immortalwrt)"
          repo_note LiBwrt/openwrt-6.x      "LiBwrt NSS 树"    "$LT" "$(prev libwrt_tree)"
          repo_note LiBwrt/LibWrt           "LibWrt 配置"      "$LC" "$(prev libwrt_cfg)"
          repo_note kiddin9/op-packages     "op-packages 插件" "$OP" "$(prev oppackages)"

          if [ ! -s "$CH" ]; then
            printf '_上游 5 个源均无新提交（本次由手动触发或 [build] 标记触发）_\n' > "$CH"
          fi
          {
            echo "changes<<__CHANGES_EOF__"
            cat "$CH"
            echo "__CHANGES_EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "=== 本次上游更新 ==="
          cat "$CH"

  build:
    needs: probe
    # probe 判定上游无变化时整段跳过，不浪费 90 分钟
    if: needs.probe.outputs.changed == '1'
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: 检出工程
        uses: actions/checkout@v4

      - name: 腾磁盘
        uses: coder-xiaomo/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget dwarves \
            llvm python3-pyelftools libpython3-dev aria2 jq rename \
            libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev
          sudo timedatectl set-timezone "Asia/Shanghai"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: 克隆 OpenWrt 25.12
        run: |
          git clone --depth 1 -b openwrt-25.12 https://github.com/openwrt/openwrt openwrt
          cd openwrt && git log --oneline -1

      - name: 打定制补丁并生成 .config
        env:
          TARGET: ${{ inputs.target }}
          WIFI_KEY: ${{ secrets.WIFI_KEY }}
          ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
        run: |
          set -x
          TARGET="${TARGET:-qualcommax_ipq60xx}"
          echo "目标设备目录: $TARGET"
          # 上游 diy.sh 依赖这个函数：稀疏克隆指定目录到当前树
          function git_clone_path() {
            trap 'rm -rf "$tmpdir"' EXIT
            branch="$1" rurl="$2" mv="$3"
            [[ "$mv" != "mv" ]] && shift 2 || shift 3
            rootdir="$PWD"
            tmpdir="$(mktemp -d)" || exit 1
            if [ ${#branch} -lt 10 ]; then
              git clone -b "$branch" --depth 1 --filter=blob:none --sparse "$rurl" "$tmpdir"
              cd "$tmpdir"
            else
              git clone --filter=blob:none --sparse "$rurl" "$tmpdir"
              cd "$tmpdir"
              git checkout $branch
            fi
            if [ "$?" != 0 ]; then echo "error on $rurl"; exit 1; fi
            git sparse-checkout init --cone
            git sparse-checkout set $@
            [[ "$mv" != "mv" ]] && cp -rn ./* $rootdir/ || mv -n $@/* $rootdir/$@/
            cd $rootdir
          }
          export -f git_clone_path

          mkdir -p openwrt
          cp -rf devices/common/. openwrt/
          cp -rf "devices/$TARGET/." openwrt/
          cp -rf devices openwrt/
          cd openwrt

          chmod +x "devices/common/diy.sh"
          /bin/bash "devices/common/diy.sh"

          cp -f devices/common/.config .config
          if [ -f "devices/$TARGET/.config" ]; then
            echo >> .config
            cat "devices/$TARGET/.config" >> .config
          fi

          if [ -f "devices/$TARGET/diy.sh" ]; then
            chmod +x "devices/$TARGET/diy.sh"
            /bin/bash "devices/$TARGET/diy.sh"
          fi

          # 设备级 diy/ 覆盖层（主题模板、banner、uci-defaults）最后铺上去
          cp -Rf ./diy/* ./ || true

          # ---- iStore / 软件包菜单覆盖校验 ----
          # luci-app-package-manager 被 luci-nginx、luci 硬依赖，摘不掉（2026-10-30 实机确认），
          # 所以改成「iStore 占顶级 + 官方页挪到系统下」。这依赖三份覆盖同时落地，
          # 少一份就会出现：菜单还叫软件包 / 两份抢同一路径 / iStore 里链接自我跳转。
          # cp -Rf ./diy/* 失败是不报错的（|| true），所以这里必须显式断言。
          sl=feeds/kiddin9/luci-app-store/luasrc/controller/store.lua
          grep -q '"iStore", 30' "$sl" || { echo "::error::store.lua 覆盖没生效，菜单标题仍是 Software"; exit 1; }
          mh=feeds/kiddin9/luci-app-store/luasrc/view/store/main.htm
          grep -q 'admin/system/package-manager' "$mh" || { echo "::error::main.htm 覆盖没生效，iStore 里的软件包链接会自我跳转"; exit 1; }
          ipm=$(find feeds -path "*luci-app-package-manager/root/usr/share/luci/menu.d/luci-app-package-manager.json" 2>/dev/null | head -1)
          if [ -z "$ipm" ]; then
            echo "::error::feeds 里找不到 luci-app-package-manager 的 menu.d，覆盖路径要重对"
            exit 1
          fi
          grep -q 'admin/system/package-manager' "$ipm" || { echo "::error::$ipm 没被覆盖，它还在占 admin/package-manager，会把 iStore 顶掉"; exit 1; }
          echo "[ok] 菜单覆盖到位: $ipm"

          # 注入 WiFi 密码：默认 12345678，配了 Secret(WIFI_KEY) 则用它覆盖
          # 仓库里只存占位符，不存任何密码明文
          WIFI_KEY="${WIFI_KEY:-12345678}"

          # 长度必须落在 WPA2-PSK 的合法区间，否则 hostapd 直接不启动，
          # 结果就是刷完开箱没有 WiFi，只能插网线救
          n=${#WIFI_KEY}
          if [ "$n" -lt 8 ] || [ "$n" -gt 63 ]; then
            echo "::error::WIFI_KEY 长度 $n 位，WPA2-PSK 只接受 8-63 位，请改 Secret 后重跑"
            exit 1
          fi

          # 用 python 做「字面」替换，不用 sed：
          #   sed 替换串里的 & 代表整个匹配内容 → 密码含 & 会被静默改成 __WIFI_KEY__
          #   # 会破坏 s#...# 的定界符 → 密码含 # 直接报错
          #   密码含单引号会让生成的 WIFI_KEY='...' 断引号 → 整个首启脚本语法错误，
          #   一条都不执行（没有 SSID、没有 IPv6、主题也不生效）
          set +x          # 密码会作为参数出现在命令行，关掉回显免得进构建日志
          python3 - "$WIFI_KEY" <<'PY'
          import io, sys
          key = sys.argv[1]
          esc = key.replace("'", "'\\''")          # shell 单引号串内转义单引号
          p = 'package/base-files/files/etc/uci-defaults/99-ax1800'
          s = io.open(p, encoding='utf-8').read()
          if '__WIFI_KEY__' not in s:
              sys.exit('[x] 99-ax1800 里找不到占位符 __WIFI_KEY__，注入没做')
          io.open(p, 'w', encoding='utf-8').write(s.replace('__WIFI_KEY__', esc))
          PY
          if grep -q '__WIFI_KEY__' package/base-files/files/etc/uci-defaults/99-ax1800; then
            echo "::error::密码注入失败，占位符还在"
            exit 1
          fi
          set -x
          echo "[+] WiFi 密码已注入（${n} 位）"

          # ---- root 密码 ----
          # Kwrt 原来在首启脚本里写死 (echo root; echo root) | passwd root，
          # 等于把后台密码公开印在固件里。这里改成构建时注入：
          #   配了 Secret(ROOT_PASSWORD) → 用它
          #   没配 → 替换成空串，首启脚本判空跳过，root 保持无密码，
          #         首次登录 LuCI 会提示「尚未设置密码」，自己设就行
          ROOT_PASSWORD="${ROOT_PASSWORD:-}"
          set +x
          python3 - "$ROOT_PASSWORD" <<'PY'
          import io, sys
          pw = sys.argv[1]
          if '\n' in pw or '\r' in pw:
              sys.exit('[x] ROOT_PASSWORD 含换行，passwd 会读错，请改 Secret')
          esc = pw.replace("'", "'\\''")
          p = 'feeds/kiddin9/my-default-settings/files/etc/uci-defaults/99-default-settings'
          s = io.open(p, encoding='utf-8').read()
          if '__ROOT_PASSWORD__' not in s:
              sys.exit('[x] 99-default-settings 里找不到占位符 __ROOT_PASSWORD__，注入没做')
          io.open(p, 'w', encoding='utf-8').write(s.replace('__ROOT_PASSWORD__', esc))
          PY
          if grep -q '__ROOT_PASSWORD__' feeds/kiddin9/my-default-settings/files/etc/uci-defaults/99-default-settings; then
            echo "::error::root 密码注入失败，占位符还在"
            exit 1
          fi
          if [ ${#ROOT_PASSWORD} -gt 0 ]; then
            MSG="root 密码已注入（${#ROOT_PASSWORD} 位）"
          else
            MSG="未配 Secret(ROOT_PASSWORD)：固件 root 无密码，首次登录请立刻设置"
            echo "::warning::$MSG"
          fi
          set -x
          echo "[+] $MSG"

      - name: 应用 devices 补丁
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -x
          TARGET="${TARGET:-qualcommax_ipq60xx}"
          cd openwrt
          # 公共补丁并进设备补丁目录后统一按顺序打
          cp -rn devices/common/patches "devices/$TARGET/" || true
          if [ -n "$(ls -A devices/$TARGET/*.bin.patch 2>/dev/null)" ]; then
            git apply devices/$TARGET/patches/*.bin.patch
          fi
          find "devices/$TARGET/patches" -maxdepth 1 -type f -name '*.revert.patch' -print0 \
            | sort -z | xargs -I % -t -0 -n 1 sh -c "patch -d './' -R --no-backup-if-mismatch -p1 -F 1 -i '%'"
          find "devices/$TARGET/patches" -maxdepth 1 -type f -name '*.patch' ! -name '*.revert.patch' ! -name '*.bin.patch' -print0 \
            | sort -z | xargs -I % -t -0 -n 1 sh -c "patch -d './' --no-backup-if-mismatch -p1 -F 1 -i '%'"

      - name: 生成配置
        run: |
          cd openwrt
          make defconfig
          # 上游同款收身：把无线驱动与 kmod-qca* 的可选模块从 =m 关成 =n，
          # 再由 defconfig 按依赖重新解算（必需项会自动回来）
          sed -n '/# Wireless Drivers/,/# end of Wireless Drivers/p' .config | sed -e 's/=m/=n/' >> .config
          sed -i "s/\(kmod-qca.*\)=m/\1=n/" .config
          # 本机无线是 AHB 接口，PCI 版驱动纯占空间；显式关成 =n（defconfig 若因
          # 硬依赖拉回 =y，下面的「编译前校验」会报错拦住，避免又编进固件）
          sed -i "s/\(kmod-ath11k-pci\)=.*/\1=n/" .config
          make defconfig
          echo "======== 关键项 ========"
          grep -E "^CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_|^CONFIG_PACKAGE_(luci-theme-argon|luci-app-openclash|dnsmasq-full|kmod-tun|kmod-nft-tproxy|kmod-nft-fullcone|kmod-qca-nss-ecm|kmod-ath11k-ahb|wpad-mbedtls|sqm-scripts-nss)=" .config
          echo "======== iStore 自检 ========"
          # luci-app-store 是"不可见符号"就会静默消失的典型：它的 Kconfig 里有一条
          #   depends on !(PACKAGE_TAR_XZ) || PACKAGE_xz-utils
          # tar 开了 XZ 而 xz-utils 不可见时，整条链变成不可见，defconfig 连
          # "is not set" 都不写。这里把 Kconfig 块和每个符号的取值都打出来，
          # 以后再被上游翻默认值坑到，一眼能定位。
          store_block() { awk '/config PACKAGE_luci-app-store$/ {f=1} f {print} f && /help$/ {exit}' tmp/.config-package.in; }
          store_block
          echo "--- 块里每个符号的取值 ---"
          for s in $(store_block | grep -oE 'PACKAGE_[A-Za-z0-9_.+-]+' | sort -u); do
            v=$(grep -m1 -E "^CONFIG_${s}=" .config || true)
            [ -n "$v" ] || v="(无此行 = 符号不可见)"
            printf '  %-46s %s\n' "$s" "$v"
          done
          echo "======== 应被关闭的项（仅打印，真正的断言在下一步「编译前校验」）========"
          # 以前这里是纯 grep，指望着「匹配不到」；但 iStore 后来改成故意开启，
          # 这条就永远匹配成功、什么也没校验；哪天把它关掉，grep 返回 1 会让
          # 整步失败。加 || true 兜底，避免反向咬人。
          grep -E "luci-app-advancedplus|luci-app-footstrap-files|dockerman|CONFIG_ALL_NONSHARED|CONFIG_TARGET_ALL_PROFILES" .config || echo "(以上均未出现，符合预期)"

      - name: 编译前校验
        # 定时触发时 inputs.* 为空，原来的 inputs.skip_check == false 会算成 false
        # 从而静默跳过校验；显式判断事件类型才能保证定时构建照样校验
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_check == false }}
        run: |
          cd openwrt
          fail=0
          for p in luci-theme-argon luci-app-openclash dnsmasq-full kmod-tun kmod-nft-tproxy \
                   kmod-nft-fullcone kmod-qca-nss-ecm kmod-ath11k-ahb wpad-mbedtls \
                   luci-app-timedreboot automount luci-app-quickfile \
                   luci-app-store luci-lib-jsonc mount-utils \
                   kmod-wireguard wireguard-tools luci-proto-wireguard; do
            if ! grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
              echo "::error::关键包 $p 没进 .config"
              fail=1
            fi
          done
          if grep -q "^CONFIG_PACKAGE_luci-app-advancedplus=y" .config; then
            echo "::error::advancedplus 还在，去推广没生效"
            fail=1
          fi
          if grep -q "^CONFIG_PACKAGE_luci-app-footstrap-files=y" .config; then
            echo "::error::footstrap-files 还在，没摘干净"
            fail=1
          fi
          if grep -q "^CONFIG_TARGET_ALL_PROFILES=y" .config; then
            echo "::error::还在编全机型，会让时间翻几倍"
            fail=1
          fi
          # AX1800 Pro 无线是 AHB 接口，PCI 版驱动纯占空间，build-17 实测仍被装进去
          if grep -qE "^CONFIG_PACKAGE_kmod-ath11k-pci=(y|m)" .config; then
            echo "::error::kmod-ath11k-pci 还在，本机是 AHB 接口用不上，应 =n"
            fail=1
          fi
          [ "$fail" = 0 ] || exit 1
          echo "校验通过"

      - name: 编译
        run: |
          cd openwrt
          make -j$(nproc) || { log=$(mktemp); make V=s &> "$log"; tail -80 "$log"; exit 1; }

      - name: 复核内核体积
        run: |
          cd openwrt
          f=$(find bin/targets/qualcommax/ipq60xx -maxdepth 1 -name '*jdcloud_re-ss-01-squashfs-factory.bin' | head -1)
          [ -n "$f" ] || { echo "::error::没找到 factory.bin"; exit 1; }
          magic=$(od -An -tx1 -N4 "$f" | tr -d ' \n')
          if [ "$magic" != "d00dfeed" ]; then
            echo "::error::factory.bin 头不是 FIT（$magic）"; exit 1
          fi
          fit=$(od -An -tu4 -j4 -N4 --endian=big "$f" | tr -d ' ')
          lim=6291456
          awk -v a="$fit" -v b="$lim" 'BEGIN{
            printf "内核 FIT: %.3f MiB / 6 MiB 分区（占用 %.1f%%，余量 %d KiB）\n", a/1048576, a*100/b, (b-a)/1024
            exit (a>b)
          }' || { echo "::error::内核超过 6MiB，刷进去会溢出"; exit 1; }

          # 6 MiB 处必须正好是 squashfs 起点（magic "hsqs" = 68 73 71 73）。
          # 布局是 append-kernel | pad-to 6144k | append-rootfs，rootfs 紧跟内核之后；
          # 若上游哪天改了 append 顺序或 pad 没生效，这里会直接报错，不会编出一个
          # 刷进去 rootfs 挂载失败的固件。
          sq=$(od -An -tx1 -j6291456 -N4 "$f" | tr -d ' \n')
          if [ "$sq" != "68737173" ]; then
            echo "::error::6MiB 处不是 hsqs（$sq），内核/rootfs 边界异常"
            exit 1
          fi
          echo "[+] 6MiB 处 hsqs 校验通过"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: kwrt-ax1800-${{ github.run_number }}
          path: |
            openwrt/bin/targets/qualcommax/ipq60xx/*jdcloud_re-ss-01*
            openwrt/.config
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          # 必须显式指定仓库。gh 是靠「从 CWD 往上找 .git 读 remote」判断操作对象的，
          # 而这步的 CWD 在 openwrt/bin/targets/... 里面 —— openwrt/ 是第 5 步
          # clone 出来的 openwrt/openwrt 仓库，gh 会往上撞到它的 .git，
          # 然后跑去给上游打 release：
          #   HTTP 403: Resource not accessible by integration
          #   (https://api.github.com/repos/openwrt/openwrt/releases)
          # build #11 就是死在这里，编译 4h47m 全白费在最后 3 秒。
          GH_REPO: ${{ github.repository }}
          # probe 阶段算好的「本次上游更新」清单（多行 markdown）
          CHANGES: ${{ needs.probe.outputs.changes }}
          PREV_BUILD: ${{ needs.probe.outputs.prev_build }}
        run: |
          cd openwrt/bin/targets/qualcommax/ipq60xx
          f=$(ls *jdcloud_re-ss-01-squashfs-factory.bin | head -1)
          fit=$(od -An -tu4 -j4 -N4 --endian=big "$f" | tr -d ' ')
          OW_SHORT=$(echo "${{ needs.probe.outputs.openwrt }}" | cut -c1-10)
          LT_SHORT=$(echo "${{ needs.probe.outputs.libwrt_tree }}" | cut -c1-10)

          # 额外附一份固定文件名的镜像。
          # 这样 releases/latest/download/sysupgrade.bin 永远指向最新版，
          # 升级不用再去翻 Release 页面找带版本号的长文件名。
          # 先确认 sysupgrade 真的存在再 cp。原来写的是
          #   cp -f "$(ls *...sysupgrade.bin | head -1)" sysupgrade.bin
          # 一旦这个文件不存在，ls 报错、$( ) 为空、cp 报 "cannot stat ''"，
          # 整步 3 秒退出且什么线索都不留（build #11 就是这个时间特征）
          up=$(ls *jdcloud_re-ss-01-squashfs-sysupgrade.bin 2>/dev/null | head -1 || true)
          if [ -z "$up" ]; then
            echo "::error::产物目录里没有 sysupgrade.bin，实际内容见下"
            ls -1
            exit 1
          fi
          cp -f "$up" sysupgrade.bin
          cp -f "$f" factory.bin

          md5sum *jdcloud_re-ss-01* > md5sums.txt
          md5sum sysupgrade.bin factory.bin >> md5sums.txt
          {
            echo "京东云亚瑟 AX1800 Pro（IPQ6000 / jdcloud_re-ss-01）· Kwrt 自编"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 内核 FIT | $fit 字节（$(awk -v a=$fit 'BEGIN{printf "%.3f", a/1048576}') MiB，6MiB 分区） |"
            echo "| 主题 | Argon 3.1.1-r38（页脚已去外链与作者署名） |"
            echo "| 机型补丁 | q6 85MiB · ath11k 16VDEV/512peers |"
            echo "| 默认 | 192.168.1.1 · 主机名 OpenWrt · SSID CLI |"
            echo "| 上游 | openwrt-25.12 \`$OW_SHORT\` · LibWrt NSS \`$LT_SHORT\` |"
            echo
            # 上游更新清单：probe 阶段用 compare API 拉的提交列表。
            # 目的就是「打开 Release 页面就知道这版比上版新在哪」，不用点进 5 个上游仓库。
            echo "## 本次上游更新"
            echo
            if [ -n "${PREV_BUILD}" ]; then
              echo "对比基准：[build-${PREV_BUILD}](https://github.com/${{ github.repository }}/releases/tag/build-${PREV_BUILD}) → 本版 build-${GITHUB_RUN_NUMBER}"
              echo
            fi
            if [ -n "${CHANGES}" ]; then
              echo "${CHANGES}"
            else
              echo "_本次未采集到上游变更记录_"
            fi
            echo
            # A5：把 .manifest 里的核心组件版本写进 Release 说明。
            # 以后排查「这版到底是哪个版本的 dnsmasq / wpad」不用先去下 50MB 的包。
            man=$(ls *jdcloud_re-ss-01.manifest 2>/dev/null | head -1 || true)
            if [ -n "$man" ]; then
              echo "## 核心组件"
              echo
              echo "| 包 | 版本 |"
              echo "|---|---|"
              for p in luci-app-store luci-theme-argon luci-app-openclash \
                       luci-app-argon-config dnsmasq-full wpad-mbedtls kmod-qca-nss-ecm \
                       sqm-scripts-nss luci-proto-wireguard; do
                v=$(awk -v p="$p" '$1==p{print $3; exit}' "$man")
                # 注意不能写 [ -n "$v" ] && echo：set -e 下循环体最后一条命令失败会直接退出
                if [ -n "$v" ]; then echo "| $p | $v |"; fi
              done
              echo
            fi
            echo "## 首次刷机"
            echo
            echo "U-Boot 网页 \`/uimage.html\` 上传 \`*-squashfs-factory.bin\`（或 \`factory.bin\`），"
            echo "别碰 /img.html /cdt.html /art.html"
            echo
            echo "## 以后在线升级（SSH 两条命令）"
            echo
            echo '```sh'
            echo "wget -O /tmp/fw.bin https://github.com/${{ github.repository }}/releases/latest/download/sysupgrade.bin"
            echo "sysupgrade /tmp/fw.bin      # 保留配置；加 -n 则清空配置"
            echo '```'
            echo
            echo "也可以 LuCI → 系统 → 备份/刷写固件 → 上传 \`sysupgrade.bin\` 并勾选「保留配置」。"
          } > release.md
          # 发布失败时把 gh 的真实 stderr 塞进 ::error:: 注解。
          # Actions 的日志下载接口要认证（未认证 403），但 check annotation 是
          # 公开可读的 —— 没有日志权限也能定位失败原因。
          echo "======== gh 身份 ========"
          gh auth status 2>&1 | sed -n '1,6p' || true
          echo "======== 即将上传 ========"
          ls -lh *jdcloud_re-ss-01* sysupgrade.bin factory.bin md5sums.txt

          # 幂等：同一个 run 重跑时 tag 已经存在，create 会直接失败。
          # 所以先探测，存在就 upload --clobber，不存在才 create。
          gh_do() {
            if "$@" 2>"$RUNNER_TEMP/gh_err.txt"; then
              return 0
            else
              local rc=$?
              echo "-------- gh stderr --------"
              cat "$RUNNER_TEMP/gh_err.txt"
              echo "--------------------------"
              local msg
              msg=$(tr '\n' ' ' < "$RUNNER_TEMP/gh_err.txt" | head -c 800)
              echo "::error::gh 调用失败（退出码 $rc）：$msg"
              return "$rc"
            fi
          }

          TAG="build-${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "[i] $TAG 已存在，改为覆盖上传"
            gh_do gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              *jdcloud_re-ss-01* sysupgrade.bin factory.bin md5sums.txt || exit 1
            echo "[+] 产物已更新：$TAG"
          else
            gh_do gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "AX1800 Pro · build ${GITHUB_RUN_NUMBER}" \
              --notes-file release.md \
              *jdcloud_re-ss-01* sysupgrade.bin factory.bin md5sums.txt || exit 1
            echo "[+] Release 已发布：$TAG"
          fi

  record:
    # 只有编译成功才记录上游版本。失败时保留旧记录，下一轮定时任务会重试同一个上游版本。
    needs: [probe, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - name: 检出工程
        uses: actions/checkout@v4

      - name: 写回本次构建用到的上游版本
        run: |
          set -eu
          # 用 echo 而不是 heredoc：heredoc 内容会带上 YAML 的缩进空格，
          # 导致 .build-state 每行前面多出空格，probe 里的 ^key= 就匹配不到了
          {
            echo "# 由 workflow 自动维护，记录上一次成功构建时用到的上游 HEAD"
            echo "# 定时任务据此判断上游有没有变化，没变就不编译"
            echo "openwrt=${{ needs.probe.outputs.openwrt }}"
            echo "immortalwrt=${{ needs.probe.outputs.immortalwrt }}"
            echo "libwrt_tree=${{ needs.probe.outputs.libwrt_tree }}"
            echo "libwrt_cfg=${{ needs.probe.outputs.libwrt_cfg }}"
            echo "oppackages=${{ needs.probe.outputs.oppackages }}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "build=${{ github.run_number }}"
          } > .build-state

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build-state
          if git diff --cached --quiet; then
            echo "状态无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 记录 build-${{ github.run_number }} 的上游版本"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main \
            || echo "::warning::状态文件推送失败，下轮定时任务会重复编译一次（无害）"
